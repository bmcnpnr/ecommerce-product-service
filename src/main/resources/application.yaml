server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/productdb}
    username: ${DB_USERNAME:productuser}
    password: ${DB_PASSWORD:productpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # A request waits at most 5s for a connection (default 30s), then fails with a 503 instead of
      # queueing request threads behind a dead or saturated database.
      connection-timeout: 5000
      # pgjdbc defaults to no socket timeout: a database that stops answering (dropped packets, a frozen host, a
      # failover without a reset) would hold the request thread until the OS gives up, many minutes later. Hikari's
      # connection-timeout only bounds the wait for a connection, not a read on one that is already open.
      data-source-properties:
        connectTimeout: 5   # seconds
        socketTimeout: 30   # seconds a read may block; statements here take milliseconds
        tcpKeepAlive: true
  jackson:
    deserialization:
      # 1.5 for an integer field is a 400, not a silent 1 (S-42)
      accept-float-as-int: false
  data:
    web:
      pageable:
        # the controllers answer 400 above 100; Spring's own clamp would hide it
        max-page-size: 2147483647
  jpa:
    hibernate:
      ddl-auto: validate
    # Controllers only touch DTOs built inside the services' transactions, so nothing needs the EntityManager
    # after the service returns. With it open (the Boot default) a read outside a transaction would keep its
    # connection until the response is written; off, a connection is held only while a transaction runs.
    open-in-view: false
    show-sql: false
    # No hibernate.dialect: Hibernate detects it from the connection (PostgreSQL
    # here, H2 under the test profile); setting it explicitly is deprecated.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Fetch the registry every 5s (default 30s) so a replaced peer is seen
    # quickly. The LoadBalancer's own instance cache is shortened to match
    # (spring.cloud.loadbalancer.cache.ttl) where this service calls peers.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Heartbeat every 5s, expire after 15s (defaults 30s / 90s): a *crashed*
    # instance leaves the registry within ~20s instead of up to two minutes.
    # Graceful stops do not wait for this: the Kubernetes preStop hook marks
    # the instance OUT_OF_SERVICE through /actuator/serviceregistry and drains
    # for 15s, then Boot's graceful shutdown deregisters it — see
    # ecommerce-platform/k8s/40-services.yaml.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,serviceregistry
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    # INFO by default; LOGGING_LEVEL_COM_ECOMMERCE=DEBUG turns debug on for a diagnosis.
    com.ecommerce: INFO
    # Hibernate writes two lines (WARN "SQL Error: ..." and ERROR with the message) for every failed JDBC call, with no
    # throttle: a pair per request for as long as the database is down. The exception handler's throttled line
    # carries the same cause once per window.
    org.hibernate.orm.jdbc.error: "OFF"
    # Logs "Application exception overridden by rollback exception" with a stack trace of several hundred lines for
    # every transaction that was in flight when its connection died (a killed backend, a database restart): up to one
    # per pooled connection. The exception handler reports the failure once per window, with the root cause.
    org.springframework.transaction.interceptor.TransactionInterceptor: "OFF"
